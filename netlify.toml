[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: /project/<slug> links are handled by React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build files and project media can be cached for a long time.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
